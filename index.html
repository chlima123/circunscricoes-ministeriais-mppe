<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Circunscrições Ministeriais do MPPE</title>
<style>
:root{
  --bg:#0d1117;--panel:#151a23;--panel2:#1c2330;--line:#2a3445;
  --ink:#e9edf3;--dim:#9aa6b8;--muted:#6e7a8d;--gold:#c9a455;--gold-soft:#e0b96f;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:"Segoe UI",-apple-system,Helvetica Neue,Arial,sans-serif;
  --mono:"SFMono-Regular",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);height:100vh;overflow:hidden}
header{display:flex;align-items:center;gap:18px;padding:14px 22px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand .logo{width:38px;height:38px;border-radius:9px;background:linear-gradient(135deg,var(--gold),#8a6d2f);display:flex;align-items:center;justify-content:center;font-weight:800;color:#0d1117;font-size:17px;flex-shrink:0}
.brand h1{font-size:16px;font-weight:700;letter-spacing:.2px;white-space:nowrap}
.brand .sub{font-size:11.5px;color:var(--muted);margin-top:1px}
.searchbox{flex:1;max-width:520px;margin-left:auto;position:relative}
.searchbox input{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:9px 14px 9px 34px;font-size:13.5px;outline:none}
.searchbox input:focus{border-color:var(--gold)}
.searchbox .ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px}
.stats{display:flex;gap:22px;margin-left:auto;padding-left:18px;border-left:1px solid var(--line)}
.stat{text-align:center}
.stat b{display:block;font-size:19px;color:var(--gold);font-family:var(--mono)}
.stat span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.wrap{display:flex;height:calc(100vh - 67px)}
nav.side{width:330px;border-right:1px solid var(--line);overflow-y:auto;background:var(--panel);padding:10px 8px;flex-shrink:0}
main{flex:1;min-width:0;overflow-y:auto;padding:30px 40px}
.tree-toggle{display:flex;align-items:center;gap:9px;cursor:pointer;padding:7px 8px;border-radius:6px;font-size:13.5px;color:var(--ink);font-weight:600}
.tree-toggle:hover{background:var(--panel2)}
.tree-toggle .caret{width:0;height:0;border-left:5px solid var(--muted);border-top:5px solid transparent;border-bottom:5px solid transparent;transition:.12s;flex-shrink:0}
.tree-toggle.open .caret{transform:rotate(90deg)}
.tree-toggle .cnt{font-size:10.5px;color:var(--muted);font-family:var(--mono);margin-left:auto}
.tree-children{margin-left:15px;border-left:1px solid var(--line);display:none;padding-left:4px}
.tree-toggle.open + .tree-children{display:block}
.art-link{display:block;cursor:pointer;padding:4px 8px 4px 12px;font-size:12.8px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:5px}
.art-link:hover{background:var(--panel2);color:var(--ink)}
.art-link.active{background:var(--panel2);color:var(--gold)}
.art-link .star{color:var(--gold);font-weight:700}
.art-link .atend{color:var(--muted);font-size:11px}
/* Home */
.home{max-width:980px;margin:0 auto}
.home h2{font-family:var(--serif);font-size:26px;margin-bottom:6px}
.home .lead{color:var(--dim);font-size:14px;margin-bottom:26px;line-height:1.6}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:30px}
.kpi{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:18px;text-align:center}
.kpi b{display:block;font-size:30px;color:var(--gold);font-family:var(--mono)}
.kpi span{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:16px 18px;cursor:pointer;transition:.15s}
.card:hover{border-color:var(--gold);transform:translateY(-2px)}
.card .num{font-family:var(--mono);font-size:12px;color:var(--gold);letter-spacing:.5px}
.card .sede{font-size:15px;font-weight:700;margin:6px 0 2px;color:var(--ink)}
.card .meta{font-size:11.5px;color:var(--muted);line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:30px}
.chip{background:var(--panel2);border:1px solid var(--line);color:var(--dim);padding:6px 13px;border-radius:20px;font-size:12px;cursor:pointer}
.chip:hover{border-color:var(--gold);color:var(--gold)}
/* Article view */
.article-view{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:34px 40px;max-width:820px;margin:0 auto}
.breadcrumb{font-size:12px;color:var(--muted);margin-bottom:18px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.breadcrumb .sep{color:var(--line)}
.breadcrumb .cr{color:var(--gold)}
.view-head{display:flex;align-items:baseline;gap:14px;margin-bottom:6px}
.view-head .label{font-family:var(--mono);font-size:12px;color:var(--gold);letter-spacing:.5px}
.view-head h3{font-family:var(--serif);font-size:24px}
.sede-badge{display:inline-block;background:rgba(201,164,85,.15);border:1px solid var(--gold);color:var(--gold-soft);font-size:11.5px;font-weight:700;padding:3px 11px;border-radius:20px;margin:4px 0 16px;letter-spacing:.4px}
.mun-list{list-style:none;margin-top:8px}
.mun-list li{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:14.5px;font-family:var(--serif)}
.mun-list li:last-child{border-bottom:none}
.mun-list li:hover{background:var(--panel)}
.mun-list .dot{width:6px;height:6px;border-radius:50%;background:var(--gold);flex-shrink:0}
.mun-list .atend{color:var(--muted);font-size:12px;font-family:var(--sans);margin-left:auto;text-align:right}
.mun-list .sede-mun{font-weight:700;color:var(--gold-soft)}
.navbar{display:flex;align-items:center;justify-content:space-between;margin-top:26px;gap:12px}
.navbar button{background:var(--panel);border:1px solid var(--line);color:var(--ink);padding:9px 16px;border-radius:8px;font-size:13px;cursor:pointer;font-family:var(--sans)}
.navbar button:hover:not(:disabled){border-color:var(--gold);color:var(--gold)}
.navbar button:disabled{opacity:.35;cursor:default}
.navbar .counter{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
/* Results */
.result{background:var(--panel2);border-left:3px solid var(--gold);padding:14px 20px;cursor:pointer;border-radius:0 8px 8px 0;margin-bottom:8px}
.result.r-active{background:#202a3a;border-color:var(--gold-soft)}
.result .r-num{font-family:var(--mono);font-size:12px;color:var(--gold)}
.result .r-path{font-size:11px;color:var(--muted);margin:2px 0 6px}
.result .r-text{font-size:13.5px;color:var(--dim);line-height:1.5}
.result .r-text mark{background:rgba(201,164,85,.22);color:var(--ink)}
footer{position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--line);padding:8px 22px;font-size:11px;color:var(--muted);display:flex;gap:18px;align-items:center;z-index:5}
footer kbd{background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 6px;font-family:var(--mono);font-size:10.5px;color:var(--dim)}
@media(max-width:920px){
  body{overflow:auto}
  .wrap{flex-direction:column;height:auto}
  nav.side{width:100%;max-height:42vh;border-right:none;border-bottom:1px solid var(--line);position:static}
  main{padding:20px 16px}
  .stats{display:none}
  .searchbox{max-width:none}
  header{flex-wrap:wrap}
  footer{position:static}
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">MP</div>
    <div>
      <h1>Circunscrições Ministeriais</h1>
      <div class="sub">Ministério Público de Pernambuco</div>
    </div>
  </div>
  <div class="searchbox">
    <span class="ico">⌕</span>
    <input id="search" type="text" placeholder="Buscar município ou circunscrição…  ( / )" autocomplete="off">
  </div>
  <div class="stats">
    <div class="stat"><b id="st-cir">14</b><span>Circunscrições</span></div>
    <div class="stat"><b id="st-mun">–</b><span>Municípios</span></div>
    <div class="stat"><b id="st-pj">–</b><span>Com Promotoria</span></div>
  </div>
</header>

<div class="wrap">
  <nav class="side" id="tree"></nav>
  <main id="view"></main>
</div>

<footer>
  <span><kbd>/</kbd> buscar</span>
  <span><kbd>↑</kbd><kbd>↓</kbd> resultados</span>
  <span><kbd>Enter</kbd> abrir</span>
  <span><kbd>←</kbd><kbd>→</kbd> navegar</span>
  <span style="margin-left:auto" id="ft-tot">14 circunscrições</span>
</footer>

<script>
/* ===== DADOS ===== */
var DATA = [
 {nome:"1ª Circunscrição",sede:"AFOGADOS DA INGAZEIRA",municipios:[
  ["Afogados da Ingazeira",1],["Brejinho","Itapetim"],["Carnaíba",1],["Iguaracy","Afogados da Ingazeira"],["Ingazeira","Tuparetama"],["Itapetim",1],["Quixaba","Carnaíba"],["Santa Terezinha","São José do Egito"],["São José do Egito",1],["Solidão","Tabira"],["Tabira",1],["Tuparetama",1]]},
 {nome:"2ª Circunscrição",sede:"PETROLINA",municipios:[
  ["Afrânio",1],["Cabrobó",1],["Dormentes","Afrânio"],["Lagoa Grande",1],["Petrolina",1],["Santa Maria da Boa Vista",1]]},
 {nome:"3ª Circunscrição",sede:"ARCOVERDE",municipios:[
  ["Arcoverde",1],["Bodocó",1],["Cedro","Serra Talhada"],["Exu",1],["Granito","Bodocó"],["Ipubi",1],["Moreilândia","Exu"],["Ouricuri",1],["Parnamirim",1],["Salgueiro",1],["Santa Cruz","Ouricuri"],["Santa Filomena","Ouricuri"],["Serrita",1],["Terra Nova","Parnamirim"],["Trindade",1],["Verdejante",1]]},
 {nome:"4ª Circunscrição",sede:"SERRA TALHADA",municipios:[
  ["Betânia","Custódia"],["Calumbi","Flores"],["Carnaubeira da Penha","Mirandiba"],["Custódia",1],["Flores",1],["Floresta",1],["Itacuruba","Belém do São Francisco"],["Jatobá","Petrolândia"],["Mirandiba",1],["Petrolândia",1],["Santa Cruz da Baixa Verde","Triunfo"],["São José do Belmonte",1],["Serra Talhada",1],["Tacaratu","Petrolândia"],["Triunfo",1]]},
 {nome:"5ª Circunscrição",sede:"GARANHUNS",municipios:[
  ["Águas Belas",1],["Angelim","Canhotinho"],["Brejão","Garanhuns"],["Caetés",1],["Calçado","Lajedo"],["Canhotinho",1],["Capoeiras",1],["Correntes",1],["Garanhuns",1],["Iati",1],["Itaíba",1],["Jucati","Jupi"],["Jupi",1],["Jurema",1],["Lagoa do Ouro","Correntes"],["Lajedo",1],["Palmeirina","São João"],["Paranatama","Saloá"],["Saloá",1],["São João",1],["Terezinha","Bom Conselho"]]},
 {nome:"6ª Circunscrição",sede:"CARUARU",municipios:[
  ["Altinho",1],["Belo Jardim",1],["Brejo da Madre de Deus",1],["Buíque",1],["Cachoeirinha",1],["Camocim de São Félix",1],["Caruaru",1],["Cupira",1],["Ibirajuba","Altinho"],["Inajá",1],["Jataúba","Santa Cruz do Capibaribe"],["Manari","Inajá"],["Panelas",1],["Pedra",1],["Pesqueira",1],["Poção","Pesqueira"],["Riacho das Almas","Caruaru"],["Sairé",1],["Sanharó",1],["Santa Cruz do Capibaribe",1],["São Bento do Una",1],["São Caetano",1],["Tacaimbó",1],["Taquaritinga do Norte",1],["Toritama",1],["Tupanatinga","Buíque"],["Venturosa",1]]},
 {nome:"7ª Circunscrição",sede:"PALMARES",municipios:[
  ["Água Preta",1],["Belém de Maria","Lagoa dos Gatos"],["Catende",1],["Jaqueira","Maraial"],["Joaquim Nabuco","Palmares"],["Lagoa dos Gatos",1],["Maraial",1],["Palmares",1],["Quipapá",1],["São Benedito do Sul","Quipapá"],["Xexéu","Água Preta"]]},
 {nome:"8ª Circunscrição",sede:"CABO DE SANTO AGOSTINHO",municipios:[
  ["Amaraji",1],["Cabo de Santo Agostinho",1],["Cortês",1],["Escada",1],["Ipojuca",1],["Primavera","Amaraji"],["São José da Coroa Grande",1],["Tamandaré",1]]},
 {nome:"9ª Circunscrição",sede:"OLINDA",municipios:[
  ["Abreu e Lima",1],["Araçoiaba","Igarassu"],["Goiana",1],["Igarassu",1],["Itamaracá",1],["Itapissuma",1],["Olinda",1],["Paulista",1]]},
 {nome:"10ª Circunscrição",sede:"NAZARÉ DA MATA",municipios:[
  ["Buenos Aires","Tracunhaém"],["Camutanga","Timbaúba"],["Condado",1],["Ferreiros","Timbaúba"],["Itambé",1],["Macaparana",1],["Nazaré da Mata",1],["São Vicente Férrer","Macaparana"],["Timbaúba",1],["Tracunhaém",1],["Vicência",1]]},
 {nome:"11ª Circunscrição",sede:"LIMOEIRO",municipios:[
  ["Bom Jardim",1],["Carpina",1],["Casinhas","Surubim"],["Cumaru",1],["Feira Nova",1],["Frei Miguelinho","Santa Maria do Cambucá"],["João Alfredo",1],["Lagoa de Itaenga",1],["Lagoa do Carro","Carpina"],["Limoeiro",1],["Machados","Bom Jardim"],["Orobó",1],["Passira",1],["Salgadinho","João Alfredo"],["Santa Maria do Cambucá",1],["Surubim",1],["Vertentes",1],["Vertente do Lério","Surubim"]]},
 {nome:"12ª Circunscrição",sede:"VITÓRIA DE SANTO ANTÃO",municipios:[
  ["Barra de Guabiraba","Bonito"],["Bonito",1],["Chã de Alegria","Glória de Goitá"],["Chã Grande","Gravatá"],["Glória do Goitá",1],["Gravatá",1],["Moreno",1],["Pombos",1],["São Joaquim do Monte",1],["Vitória de Santo Antão",1]]},
 {nome:"13ª Circunscrição",sede:"JABOATÃO DOS GUARARAPES",municipios:[
  ["Camaragibe",1],["Jaboatão dos Guararapes",1],["São Lourenço da Mata",1]]},
 {nome:"14ª Circunscrição",sede:"CAPITAL (RECIFE)",municipios:[
  ["Recife",1]]}
];

/* ===== FLATTEN ===== */
var all=[];
(function(){
  DATA.forEach(function(c,ci){
    c.municipios.forEach(function(m){
      var nome=m[0], atend=m[1];
      all.push({num:nome, text:nome, atend:atend===1?null:atend, isSede:(nome.toUpperCase()===c.sede.toUpperCase()),
        path:c.nome, parte:c.nome, ci:ci, sede:c.sede});
    });
  });
})();

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

/* ===== ÁRVORE ===== */
function buildTree(){
  var tree=document.getElementById('tree'); tree.innerHTML='';
  DATA.forEach(function(c,ci){
    var wrap=document.createElement('div');
    var tgl=document.createElement('div');
    tgl.className='tree-toggle open';
    tgl.innerHTML='<span class="caret"></span>'+esc(c.nome)+'<span class="cnt">'+c.municipios.length+'</span>';
    tgl.onclick=function(){tgl.classList.toggle('open');};
    wrap.appendChild(tgl);
    var kids=document.createElement('div');
    kids.className='tree-children';
    c.municipios.forEach(function(m){
      var a=document.createElement('div');
      a.className='art-link';
      a.dataset.ci=ci;
      a.dataset.nome=esc(m[0]);
      var isSede=(m[0].toUpperCase()===c.sede.toUpperCase());
      a.innerHTML=(isSede?'<span class="star">★ </span>':'')+esc(m[0])+(m[1]!==1?' <span class="atend">→ '+esc(m[1])+'</span>':'');
      a.onclick=function(){openMun(ci,m[0]);};
      kids.appendChild(a);
    });
    wrap.appendChild(kids);
    tree.appendChild(wrap);
  });
}

/* ===== HOME ===== */
function renderHome(){
  var v=document.getElementById('view');
  var chips=['Caruaru','Garanhuns','Petrolina','Recife','Olinda','Palmares','Limoeiro','Serra Talhada','Afogados da Ingazeira','Jaboatão dos Guararapes'];
  var cards='';
  DATA.forEach(function(c,ci){
    var comPJ=c.municipios.filter(function(m){return m[1]===1;}).length;
    cards+='<div class="card" onclick="goPart('+ci+')">'
      +'<div class="num">'+esc(c.nome)+'</div>'
      +'<div class="sede">★ '+esc(c.sede)+'</div>'
      +'<div class="meta">'+c.municipios.length+' municípios · '+comPJ+' com Promotoria</div>'
      +'</div>';
  });
  v.innerHTML='<div class="home">'
    +'<h2>Circunscrições Ministeriais do MPPE</h2>'
    +'<p class="lead">Mapa oficial das Circunscrições do Ministério Público de Pernambuco. '
    +'<b>MAIÚSCULAS</b> = sede da Circunscrição · <b>★</b> = município-sede · '
    +'<b>→</b> = município sem promotoria própria, atendido pela Promotoria do local indicado.</p>'
    +'<div class="kpis">'
    +'<div class="kpi"><b>14</b><span>Circunscrições</span></div>'
    +'<div class="kpi"><b id="k-mun">–</b><span>Municípios</span></div>'
    +'<div class="kpi"><b id="k-pj">–</b><span>Com Promotoria</span></div>'
    +'<div class="kpi"><b id="k-at">–</b><span>Atendidos por outra</span></div>'
    +'</div>'
    +'<div class="cards">'+cards+'</div>'
    +'<div class="chips">'+chips.map(function(t){return '<span class="chip" onclick="doSearch(\''+t.replace(/'/g,"\\'")+'\')">'+esc(t)+'</span>';}).join('')+'</div>'
    +'</div>';
}

/* ===== VISÃO DE CIRCUNSCRIÇÃO ===== */
function openMun(ci,nome){
  var c=DATA[ci];
  var m=c.municipios.filter(function(x){return x[0]===nome;})[0];
  if(!m)return;
  var isSede=(m[0].toUpperCase()===c.sede.toUpperCase());
  var idx=all.findIndex(function(a){return a.ci===ci && a.num===nome;});
  var lis=c.municipios.map(function(x){
    var xs=(x[0].toUpperCase()===c.sede.toUpperCase());
    return '<li><span class="dot"></span><span class="'+(xs?'sede-mun':'')+'">'+esc(x[0])+'</span>'
      +(x[1]!==1?'<span class="atend">atendido por '+esc(x[1])+'</span>':'<span class="atend">Promotoria própria</span>')+'</li>';
  }).join('');
  var v=document.getElementById('view');
  v.innerHTML='<div class="article-view">'
    +'<div class="breadcrumb"><span class="cr">'+esc(c.nome)+'</span><span class="sep">/</span><span>'+esc(m[0])+'</span></div>'
    +'<div class="view-head"><span class="label">'+esc(c.nome)+'</span><h3>'+esc(m[0])+'</h3></div>'
    +(isSede?'<div class="sede-badge">★ SEDE DA CIRCUNSCRIÇÃO</div>':'')
    +(m[1]!==1?'<div class="sede-badge" style="background:rgba(110,122,141,.15);border-color:var(--line);color:var(--dim)">Atendido pela Promotoria de '+esc(m[1])+'</div>':'')
    +'<ul class="mun-list">'+lis+'</ul>'
    +'<div class="navbar">'
    +'<button '+(idx>0?'onclick="navTo('+(idx-1)+')"':'disabled')+'>&larr; Anterior</button>'
    +'<span class="counter">'+(idx+1)+' / '+all.length+'</span>'
    +'<button '+(idx<all.length-1?'onclick="navTo('+(idx+1)+')"':'disabled')+'>Próximo &rarr;</button>'
    +'</div></div>';
  syncTree(ci,nome);
}

function navTo(i){
  if(i<0||i>=all.length)return;
  openMun(all[i].ci,all[i].num);
}

function syncTree(ci,nome){
  document.querySelectorAll('.art-link').forEach(function(x){x.classList.remove('active');});
  var t=document.querySelector('.art-link[data-ci="'+ci+'"][data-nome="'+esc(nome)+'"]');
  if(t){t.classList.add('active');t.scrollIntoView({block:'center'});}
}

function goPart(ci){
  var c=DATA[ci];
  openMun(ci,c.sede);
  var tgl=document.querySelectorAll('.tree-toggle')[ci];
  if(tgl)tgl.classList.add('open');
}

/* ===== BUSCA ===== */
var resultsArr=[],selVal=0;
function doSearch(q){
  q=(q||'').trim();
  if(q.length<2){renderHome();return;}
  var lq=q.toLowerCase(),hits=[];
  hits=all.filter(function(a){
    return a.num.toLowerCase().includes(lq) || a.sede.toLowerCase().includes(lq) || a.parte.toLowerCase().includes(lq) || (a.atend&&a.atend.toLowerCase().includes(lq));
  }).slice(0,80);
  renderResults(q,hits);
}
function renderResults(q,hits){
  resultsArr=hits;
  var v=document.getElementById('view');
  if(!hits.length){
    v.innerHTML='<div class="home"><h2>Sem resultados para “'+esc(q)+'”</h2><p class="lead">Tente outro município ou circunscrição.</p></div>';
    return;
  }
  var html='<div class="home"><h2>'+hits.length+' resultado(s) para “'+esc(q)+'”</h2><div style="margin-top:18px">';
  hits.forEach(function(a,i){
    var t=a.text, pos=t.toLowerCase().indexOf(q.toLowerCase());
    var pre=pos>0?esc(t.slice(0,pos)):'', m=esc(t.slice(pos,pos+q.length)), post=esc(t.slice(pos+q.length));
    html+='<div class="result" data-i="'+i+'" onclick="openResult(this)">'
      +'<div class="r-num">'+esc(a.num)+(a.isSede?' ★ Sede':'')+'</div>'
      +'<div class="r-path">'+esc(a.parte)+'</div>'
      +'<div class="r-text">'+pre+'<mark>'+m+'</mark>'+post+'</div></div>';
  });
  html+='</div></div>';
  v.innerHTML=html;
}
function openResult(el){
  var a=resultsArr[parseInt(el.dataset.i)];
  if(a){openMun(a.ci,a.num);document.getElementById('search').value='';}
}

/* ===== TECLADO ===== */
var searchInput=document.getElementById('search');
searchInput.addEventListener('keydown',function(e){
  if(e.key==='Enter'){var r=document.querySelector('.result[data-i]');if(r)openResult(r);}
  else if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault();
    var rs=document.querySelectorAll('.result');if(!rs.length)return;
    rs.forEach(function(r){r.classList.remove('r-active');});
    selVal=e.key==='ArrowDown'?(selVal+1)%rs.length:(selVal-1+rs.length)%rs.length;
    rs[selVal].classList.add('r-active');rs[selVal].scrollIntoView({block:'nearest'});
  }
});
document.addEventListener('keydown',function(e){
  if(e.key==='/'){e.preventDefault();document.getElementById('search').focus();}
  else if(e.key==='ArrowLeft'||e.key==='ArrowRight'){
    if(document.activeElement===searchInput)return;
    var cur=document.querySelector('.art-link.active');
    if(!cur)return;
    var ci=parseInt(cur.dataset.ci), nome=cur.dataset.nome;
    var idx=all.findIndex(function(a){return a.ci===ci&&a.num===nome;});
    if(e.key==='ArrowLeft'&&idx>0)navTo(idx-1);
    else if(e.key==='ArrowRight'&&idx<all.length-1)navTo(idx+1);
  }
});

/* ===== INIT ===== */
function computeTotals(){
  var tot=0, pj=0, at=0;
  DATA.forEach(function(c){c.municipios.forEach(function(m){tot++; if(m[1]===1)pj++; else at++;});});
  var set=function(id,v){var e=document.getElementById(id); if(e)e.textContent=v;};
  set('st-mun',tot); set('st-pj',pj);
  set('k-mun',tot); set('k-pj',pj); set('k-at',at);
  var ft=document.getElementById('ft-tot'); if(ft)ft.textContent=tot+' municípios · '+pj+' com Promotoria de Justiça · '+at+' atendidos por outra';
}
buildTree();
renderHome();
computeTotals();
</script>
